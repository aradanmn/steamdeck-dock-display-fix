# ~/.config/systemd/user/gamescope-session.service.d/predock-probe.conf
#
# Systemd drop-in that hooks predock-probe.sh into Gamescope startup.
# Raises the start timeout to allow up to 45s of EDID polling + headroom.

[Service]
TimeoutStartSec=90
ExecStartPre=/home/deck/.local/bin/predock-probe.sh
